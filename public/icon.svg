<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#54E5FF"/>
      <stop offset="60%" stop-color="#FFB15E"/>
      <stop offset="100%" stop-color="#FF7043"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Shield / Hexagon -->
  <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="#08111F" stroke="#54E5FF" stroke-width="3" stroke-opacity="0.8"/>
  <polygon points="50,10 86,29 86,71 50,90 14,71 14,29" fill="#101722" fill-opacity="0.9" stroke="url(#grad)" stroke-width="1.5"/>

  <!-- RV Monogram Design -->
  <!-- Letter R -->
  <path d="M 28 32 L 28 68 M 28 32 L 44 32 C 51 32 51 46 44 46 L 28 46 M 40 46 L 50 68" 
        stroke="url(#grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>

  <!-- Letter V with futuristic apex -->
  <path d="M 52 32 L 64 68 L 76 32" 
        stroke="#54E5FF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>

  <!-- Tech Cyan Node Dot -->
  <circle cx="64" cy="68" r="3" fill="#54E5FF" filter="url(#glow)"/>
</svg>
